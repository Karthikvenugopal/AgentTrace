experiment_id: mock-matrix-demo
source_trace: examples/traces/mock-agent.jsonl
measurement_label: mock
output_dir: results
replay:
  mode: parameterized
  endpoint:
    base_url: http://127.0.0.1:8010/v1
    model: agenttrace-mock
    timeout_seconds: 30
    max_retries: 0
    stream: true
  time_scale: 0.05
  max_concurrency: 16
  request_timeout_seconds: 30
  retry_count: 1
  seed: 7
  output_tokens: 16
  execution_length: 2
matrix:
  context_tokens: [64, 256]
  concurrent_agents: [1, 2]
  patterns: [concurrent, parent_subagents]
  workload_types: [parameterized]
  replay_modes: [open_loop, closed_loop]
warmup_requests: 1
repetitions: 2
randomize_order: true
rotate_order_each_repetition: true
seed: 7
server_metadata:
  backend: agenttrace-mock
  simulated_delays: true
  prefix_caching: false

