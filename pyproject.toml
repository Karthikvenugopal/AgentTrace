[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Coding-agent inference workload profiler"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AgentTrace contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-exporter-otlp-proto-http>=1.27,<2"]
tokenizers = ["transformers>=4.44,<5"]
gpu = ["torch>=2.4,<3", "vllm>=0.6,<1"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
agenttrace = "agenttrace.cli.app:app"

[project.urls]
Repository = "https://github.com/Karthikvenugopal/AgentTrace"
Issues = "https://github.com/Karthikvenugopal/AgentTrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

